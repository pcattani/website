<script>
	/* Toggle between showing and hiding the navigation menu links when the user clicks on the hamburger menu / bar icon */
  function toggle() {
      var x = document.getElementById("mynav");
      var y = document.getElementById("menu_img");
     // alert(y.src);

      if (x.className === "navigation") {
          x.className = "responsive";
      } else {
          x.className = "navigation";
      }
      if(y.src.search("menu") ==-1){
		  y.src = y.src.replace("chevrons_whitesmoke.svg","menu_whitesmoke.svg");
	  } else {
		  y.src = y.src.replace("menu_whitesmoke.svg","chevrons_whitesmoke.svg");
	  }
  } 
</script>
